<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>🎮 GamingClock</title>
</head>
<body>
    <main class="main-content">
    <a href="https://github.com/nostalgic-css/NES.css" target="_blank" rel="noopener" class="github-link active">
        <p class="nes-balloon from-right">Help us improve<br>on GitHub!</p> <i class="nes-octocat"></i>
    </a>
    <div class="container">
        <h1>GamingClock</h1>
        <p>Finally finish your backlog of games by scheduling them!</p>
    </div>

    <section class="showcase" >
        <section class="nes-container with-title">
            <h3 class="title">Search</h3>
            <div id="inputs" class="item">
                <div class="nes-field">
                    <label for="name_field">Game name:</label>
                    <input type="text" id="game_name" class="nes-input">
                    <br>
                    <button type="button" class="nes-btn is-warning nes-pointer" onclick=" howlongtobeat()">add game</button>
                </div>
            </div>
        </section>
    </section>

    <section class="showcase" style="visibility: hidden" id="results_section">
        <section class="nes-container with-title">
            <h3 class="title">Results</h3>

        <div class="nes-table-responsive">
            <table class="nes-table is-bordered is-centered" id="results">
                <thead>
                    <th>name</th>
                    <th>cover</th>
                    <th>duration - main</th>
                    <th>remover</th>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <br>
        <button type="button" class="nes-btn is-error nes-pointer">schedule!</button>
        </section>
    </section>
    </main>

    <script>
        async function howlongtobeat() {
                console.log("Requesting data...");
                let response = await fetch("http://127.0.0.1:8000/", {
                    method: "post",
                    body: document.getElementById("game_name").value,
                });
                let data = await response.json();
                console.log("Response: ", data);
                let name = data["name"];
                let image_url = data["image_url"];
                let duration = data["duration"];
                var resultsRef = document.getElementById('results_section')
                resultsRef.style.visibility = "visible";
                var tbodyRef = document.getElementById('results').getElementsByTagName('tbody')[0];
                // Insert a row at the end of table
                var newRow = tbodyRef.insertRow();
                // Insert a cell at the end of the row
                var newCell = newRow.insertCell();
                var newText = document.createTextNode(name);
                newCell.appendChild(newText);

                var newCell = newRow.insertCell();
                var img = document.createElement('img');
                img.className = "nes-avatar is-large"
                img.style = "image-rendering: pixelated;"
                img.src = image_url;
                newCell.appendChild(img);

                var newCell = newRow.insertCell();
                var newText = document.createTextNode(duration);
                newCell.appendChild(newText);

            }
    </script>
</body>

</html>
