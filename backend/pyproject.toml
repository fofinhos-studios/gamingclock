[project]
name = "gamingclock"
version = "0.1.0"
description = "Gaming backlog clock - estimate how long to beat your game lists"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "httpx>=0.28",
    "howlongtobeatpy>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.5",
    "pytest-asyncio>=0.25",
    "polyfactory>=2.19",
    "httpx",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
