name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: cd backend && uv sync --group dev

      - name: Audit dependencies
        run: cd backend && uv audit --locked

      - name: Lint
        run: cd backend && uv run ruff check src/ tests/ && uv run ty check

      - name: Test
        run: cd backend && uv run pytest -n auto -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/aube-action@v1
        with:
          node-version: "22"
          working-directory: frontend

      - name: Audit dependencies
        run: cd frontend && aube audit

      - name: Lint
        run: cd frontend && aube exec biome check src/

      - name: Test
        run: cd frontend && aube test

      - name: Build
        run: cd frontend && aube build
